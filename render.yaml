services:
  # 1. React Web Risk Operations Dashboard (Free Global Static Site)
  - type: web
    name: vaultguard-web
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20

  # 2. Node.js WebSocket & Real-Time Gateway (Free Web Service)
  - type: web
    name: vaultguard-gateway-node
    runtime: node
    plan: free
    buildCommand: cd services/gateway-node && npm install && npm run build
    startCommand: cd services/gateway-node && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000

  # 3. Python FastAPI AI Fraud Detection Engine (Free Web Service)
  - type: web
    name: vaultguard-fraud-python
    runtime: python
    plan: free
    buildCommand: cd services/fraud-python && pip install -r requirements.txt
    startCommand: cd services/fraud-python && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11

# 4. Managed Free PostgreSQL Database
databases:
  - name: vaultguard-postgres-db
    plan: free
    databaseName: vaultguard_db
    user: vaultguard_admin
