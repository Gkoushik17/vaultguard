events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate limiting zone (FinTech DDoS & brute-force defense)
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=100r/s;

    upstream core_go_upstream {
        server core-go:8080;
    }

    upstream fraud_python_upstream {
        server fraud-python:8000;
    }

    upstream gateway_node_upstream {
        server gateway-node:5000;
    }

    upstream web_upstream {
        server web:80;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Golang Payment Core API (Rate-limited, high-throughput)
        location /api/v1/payments {
            limit_req zone=payment_limit burst=50 nodelay;
            proxy_pass http://core_go_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/accounts {
            proxy_pass http://core_go_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Python AI Fraud Detection Engine
        location /api/v1/fraud {
            proxy_pass http://fraud_python_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Node.js WebSocket Live Feed & Gateway
        location /ws {
            proxy_pass http://gateway_node_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /api/stats {
            proxy_pass http://gateway_node_upstream;
            proxy_set_header Host $host;
        }

        location /api/alerts {
            proxy_pass http://gateway_node_upstream;
            proxy_set_header Host $host;
        }

        location /api/events {
            proxy_pass http://gateway_node_upstream;
            proxy_set_header Host $host;
        }

        # 4. React Web Frontend Dashboard
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
